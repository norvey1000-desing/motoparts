<nav class="bg-slate-900 border-b border-slate-800 px-6 py-3.5 flex justify-between items-center select-none shadow-md relative">
  <!-- Marca / Logo -->
  <div class="flex items-center gap-3 cursor-pointer" [routerLink]="usuario?.rol?.toLowerCase() === 'admin' ? '/inventario' : '/pos'">
    <div class="w-9 h-9 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 rounded-xl flex items-center justify-center font-bold text-sm">
      🏍️
    </div>
    <div>
      <h1 class="text-sm font-black text-white tracking-wide">MotoParts <span class="text-indigo-500">POS</span></h1>
      <p class="text-[10px] text-slate-400">Sistema de Gestión</p>
    </div>
  </div>

  <!-- Pestañas Centrales (Condicionadas por Rol de forma flexible) -->
  <div class="flex items-center gap-2 bg-slate-950 p-1.5 border border-slate-800/80 rounded-2xl">
    <a routerLink="/pos" 
       routerLinkActive="bg-indigo-600 text-white shadow-lg shadow-indigo-600/20"
       class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition-all cursor-pointer">
      ⚡ POS (Ventas)
    </a>
    <a *ngIf="usuario?.rol?.toLowerCase() === 'admin'"
       routerLink="/inventario" 
       routerLinkActive="bg-indigo-600 text-white shadow-lg shadow-indigo-600/20"
       [routerLinkActiveOptions]="{exact: true}"
       class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition-all cursor-pointer">
      📦 Inventario
    </a>
    <a *ngIf="usuario?.rol?.toLowerCase() === 'admin'"
       routerLink="/contabilidad" 
       routerLinkActive="bg-indigo-600 text-white shadow-lg shadow-indigo-600/20"
       class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition-all cursor-pointer">
      📊 Contabilidad
    </a>
  </div>

  <!-- Perfil de Usuario con Menú Desplegable -->
  <div class="relative">
    <div (click)="toggleMenu($event)" 
         class="flex items-center gap-2.5 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl cursor-pointer hover:border-indigo-500 transition-all">
      <div class="w-7 h-7 rounded-lg bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 flex items-center justify-center text-xs font-bold">
        👤
      </div>
      <div class="text-left">
        <p class="text-xs font-bold text-white leading-tight max-w-[130px] truncate">{{ usuario?.email || 'Usuario' }}</p>
        <span class="text-[10px] text-indigo-400 font-semibold">{{ usuario?.rol || 'Cajero' }}</span>
      </div>
      <span class="text-[10px] text-slate-400 ml-1 transition-transform" [ngClass]="{'rotate-180': menuAbierto}">▼</span>
    </div>

    <!-- Menú Desplegable Flotante -->
    <div *ngIf="menuAbierto" 
         (click)="$event.stopPropagation()" 
         class="absolute right-0 mt-2 w-52 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl py-2 z-50 animate-fadeIn">
      <div class="px-4 py-2 border-b border-slate-800">
        <p class="text-[10px] text-slate-400">Cuenta activa:</p>
        <p class="text-xs font-bold text-white truncate">{{ usuario?.email }}</p>
      </div>

      <!-- Solo visible para Administradores -->
      <div *ngIf="usuario?.rol?.toLowerCase() === 'admin'" class="py-1">
        <button (click)="irAUsuarios()" 
                class="w-full text-left px-4 py-2.5 text-xs text-slate-300 hover:bg-slate-800/60 hover:text-white flex items-center gap-2.5 transition-all cursor-pointer">
          <span class="text-sm">👥</span> Gestionar Usuarios
        </button>
      </div>

      <div class="border-t border-slate-800 pt-1">
        <button (click)="cerrarSesion()" 
                class="w-full text-left px-4 py-2.5 text-xs text-rose-400 hover:bg-rose-500/10 flex items-center gap-2.5 transition-all cursor-pointer">
          <span class="text-sm">🚪</span> Cerrar Sesión
        </button>
      </div>
    </div>
  </div>
</nav>
