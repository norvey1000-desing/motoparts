<div class="fixed inset-0 w-full h-full bg-slate-950 flex items-center justify-center p-4 font-sans text-slate-100 z-50">
  
  <div class="relative w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6 pointer-events-auto">
    
    <!-- Encabezado / Logo -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 rounded-2xl mx-auto flex items-center justify-center text-xl font-bold">
        🏍️
      </div>
      <h2 class="text-xl font-black text-white tracking-wide">MotoParts <span class="text-indigo-500">POS</span></h2>
      <p class="text-xs text-slate-400">Ingresa tus credenciales para acceder al sistema</p>
    </div>

    <!-- Alerta de Error -->
    <div *ngIf="errorLogin" class="bg-rose-500/10 border border-rose-500/20 text-rose-400 p-3 rounded-xl text-xs text-center font-medium">
      {{ errorLogin }}
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="iniciarSesion()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Correo Electrónico</label>
        <input type="email" 
               [(ngModel)]="credentials.email" 
               name="email" 
               required 
               autocomplete="email"
               placeholder="admin@motoparts.com"
               class="w-full px-4 py-3 bg-slate-950 border border-slate-700 focus:border-indigo-500 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-all cursor-text relative z-10">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Contraseña</label>
        <input type="password" 
               [(ngModel)]="credentials.password" 
               name="password" 
               required 
               autocomplete="current-password"
               placeholder="••••••••"
               class="w-full px-4 py-3 bg-slate-950 border border-slate-700 focus:border-indigo-500 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-all cursor-text relative z-10">
      </div>

      <button type="submit" 
              [disabled]="cargando"
              class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] disabled:opacity-50 text-white rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30 transition-all cursor-pointer flex items-center justify-center gap-2 mt-2 relative z-10">
        <span *ngIf="cargando" class="animate-spin">⏳</span>
        {{ cargando ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>
    </form>

  </div>
</div>
